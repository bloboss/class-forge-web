[package]
name = "class-forge-web"
version = "0.1.0"
edition = "2021"
description = "ClassForge web frontend (Leptos) — forge-agnostic classroom management."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
leptos = { version = "0.7", features = ["csr"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
console_error_panic_hook = "0.1"
web-sys = { version = "0.3", features = ["Window", "Document", "HtmlDocument", "Element", "HtmlElement", "Location", "Storage", "DomTokenList", "RequestCredentials"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
gloo-net = "0.6"
async-trait = "0.1"

[features]
default = []
mock = []

[dev-dependencies]
wasm-bindgen-test = "0.3"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[package.metadata.leptos]
output-name = "class_forge_web"
